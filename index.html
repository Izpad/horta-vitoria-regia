<title>Caderno da Horta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700&display=swap">
<style>

:root {
  --bg: #F3F6F1;
  --surface: #FFFFFF;
  --surface-2: #E8EEE5;
  --ink: #1B2620;
  --muted: #526158;
  --line: #D3DCCF;
  --leaf: #2E7D4F;
  --leaf-ink: #FFFFFF;
  --leaf-soft: #D9EBDF;
  --sun-ink: #7A4F0B;
  --sun-soft: #F7E8C4;
  --rain-ink: #1F5A86;
  --rain-soft: #DAE9F5;
  --danger-ink: #A3321F;
  --danger-soft: #F6DCD6;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-head: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1711; --surface: #18231C; --surface-2: #213027; --ink: #E7EFE8; --muted: #A5B5AA;
    --line: #2E3F33; --leaf: #5CBA84; --leaf-ink: #0C1A11; --leaf-soft: #1F3A2A;
    --sun-ink: #F0C36A; --sun-soft: #3A2F14; --rain-ink: #8CC1E8; --rain-soft: #1A2E3E;
    --danger-ink: #F29A89; --danger-soft: #402019;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1711; --surface: #18231C; --surface-2: #213027; --ink: #E7EFE8; --muted: #A5B5AA;
  --line: #2E3F33; --leaf: #5CBA84; --leaf-ink: #0C1A11; --leaf-soft: #1F3A2A;
  --sun-ink: #F0C36A; --sun-soft: #3A2F14; --rain-ink: #8CC1E8; --rain-soft: #1A2E3E;
  --danger-ink: #F29A89; --danger-soft: #402019;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
}
body.noscroll { overflow: hidden; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; }
h3 { font-size: 19px; }
p { margin: 0; }
a { color: var(--leaf); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--rain-ink); outline-offset: 2px; }
.app { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { font-size: 26px; }
.brand span { color: var(--muted); font-size: 15px; }
.sync { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; }
.sync i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.sync.shared i { background: var(--leaf); }
.sync.local i { background: #D98E04; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.soft { background: var(--surface-2); border-color: transparent; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row.start { align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.meta { color: var(--muted); font-size: 15px; }
.lead { font-size: 18px; }
.hint { font-size: 14px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.grow { background: var(--rain-soft); color: var(--rain-ink); }
.chip.soon { background: var(--sun-soft); color: var(--sun-ink); }
.chip.ready, .chip.l2 { background: var(--leaf); color: var(--leaf-ink); }
.chip.late, .chip.low { background: var(--danger-soft); color: var(--danger-ink); }
.chip.l1 { background: var(--sun-soft); color: var(--sun-ink); }
.chip.l0, .chip.done { background: var(--surface-2); color: var(--muted); }
.btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { min-height: 42px; padding: 0 14px; font-size: 16px; }
.btn.danger { color: var(--danger-ink); }
.btn.armed { background: var(--danger-soft); border-color: var(--danger-ink); color: var(--danger-ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg .btn { min-height: 44px; }
.seg .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--muted); }
.empty strong { color: var(--ink); font-size: 18px; }
.notice { border-radius: 12px; padding: 12px 14px; background: var(--sun-soft); color: var(--sun-ink); font-size: 15px; font-weight: 700; }
.notice.info { background: var(--rain-soft); color: var(--rain-ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 16px; }
input, select, textarea { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
textarea { min-height: 96px; resize: vertical; }
.fields { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 440px) { .two { grid-template-columns: 1fr; } }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.strip .m { height: 28px; display: grid; place-items: center; border-radius: 6px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.strip .m2 { background: var(--leaf); color: var(--leaf-ink); }
.strip .m1 { background: var(--leaf-soft); color: var(--ink); }
.strip .m.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--leaf); border-radius: 999px; }
.bar.late > span { background: var(--danger-ink); }
details summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; color: var(--leaf); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 16px; }
dt { color: var(--muted); font-weight: 700; }
dd { margin: 0; }
.qty { display: inline-flex; align-items: center; gap: 8px; }
.qty b { min-width: 3ch; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
.qty .btn { width: 48px; padding: 0; font-size: 24px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; font-size: 15px; }
th, td { padding: 6px 4px; text-align: center; }
th { font-size: 13px; color: var(--muted); }
td:first-child, th:first-child { text-align: left; padding-left: 12px; position: sticky; left: 0; background: var(--surface); z-index: 1; font-weight: 700; min-width: 120px; }
tr.grp td { background: var(--surface-2); font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: left; padding-left: 12px; }
td .dot { display: block; height: 20px; margin: 0 2px; border-radius: 5px; background: var(--surface-2); }
td .dot.m2 { background: var(--leaf); } td .dot.m1 { background: var(--leaf-soft); }
td.now .dot { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 14px; border-radius: 4px; display: inline-block; background: var(--surface-2); }
.legend i.m2 { background: var(--leaf); } .legend i.m1 { background: var(--leaf-soft); }
.day { font-family: var(--font-head); font-size: 16px; color: var(--muted); padding-top: 6px; }
.log { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.log .txt { overflow-wrap: anywhere; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right, 0px), calc((100vw - 860px) / 2)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px), calc((100vw - 860px) / 2)); }
.nav button { min-height: 62px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 12px; }
.nav button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--leaf); background: var(--leaf-soft); }
#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 10, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet-panel { background: var(--bg); width: min(640px, 100%); max-height: 92%; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { #sheet { align-items: center; } .sheet-panel { border-radius: 20px; } }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .4s ease; } }
</style>

<div class="app">
  <header class="top">

      <h1>Caderno da Horta</h1>

    <section class="panel" id="p-sementes" aria-label="Sementes" hidden></section>
    <section class="panel" id="p-diario" aria-label="Diário" hidden></section>

</div>

  function $(s, r) { return (r || document).querySelector(s); }

  /* ---------- Armazenamento: compartilhado (db) ou neste aparelho ---------- */

  var chain = {};
  function enqueue(key, fn) {

  }
  function loadLocal() {
    try {
      var raw = ls.get('caderno-horta-v1');

  }

  function save(col, obj) {
    var id = obj.id || uid();

      var i = S[col].findIndex(function (x) { return x.id === id; });

  /* ---------- Interface: estado e navegação ---------- */

  /* ---------- Aba Plantios ---------- */

        '<div class="empty"><strong>' + (UI.plantFilter === 'ativos' ? 'Nenhum plantio em andamento' : 'Nenhuma colheita registrada') + '</strong><span>' + (UI.plantFilter === 'ativos' ? 'Registre o que foi plantado, em qual canteiro e quando.' : 'Quando você marcar um plantio como colhido, ele aparece aqui.') + '</span></div>';
    }
    $('#p-plantios').innerHTML = h;
  }

  /* ---------- Aba Sementes ---------- */
  function renderSementes() {
    var h = readOnlyNotice();
    h += '<div class="row"><h2>Estoque de sementes</h2>' + (W() ? '<button class="btn primary" type="button" data-act="seed-new">Cadastrar semente</button>' : '') + '</div>';
    if (env.mode === 'loading') h += loadingBox();
    else if (!S.seeds.length) h += '<div class="empty"><strong>Nenhuma semente cadastrada</strong><span>Cadastre o que a horta tem guardado. O caderno avisa quando o estoque ficar baixo.</span></div>';
    else {
      h += S.seeds.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'pt-BR'); }).map(function (s) {
        var low = Number(s.qty) <= Number(s.min || 0);
        return '<article class="card"><div class="row start"><div class="stack" style="gap:2px"><h3>' + esc(s.name) + '</h3><span class="meta">Mínimo: ' + esc(s.min || 0) + ' ' + esc(s.unit || '') + (s.note ? ' · ' + esc(s.note) : '') + '</span></div>' + (low ? '<span class="chip low">Repor</span>' : '<span class="chip l2">Em estoque</span>') + '</div>' +
          '<div class="row"><div class="qty">' + (W() ? '<button class="btn" type="button" data-act="seed-adj" data-id="' + esc(s.id) + '" data-d="-1" aria-label="Tirar uma unidade de ' + esc(s.name) + '">−</button>' : '') + '<b aria-live="polite">' + esc(s.qty) + '</b><span class="meta">' + esc(s.unit || '') + '</span>' + (W() ? '<button class="btn" type="button" data-act="seed-adj" data-id="' + esc(s.id) + '" data-d="1" aria-label="Pôr uma unidade de ' + esc(s.name) + '">+</button>' : '') + '</div>' +
          (W() ? '<div class="actions">' + (low ? '<button class="btn small primary" type="button" data-act="req-new" data-id="' + esc(s.id) + '">Pedir mais</button>' : '') + '<button class="btn small" type="button" data-act="seed-edit" data-id="' + esc(s.id) + '">Editar</button><button class="btn small danger" type="button" data-act="del" data-col="seeds" data-id="' + esc(s.id) + '">Excluir</button></div>' : '') + '</div></article>';
      }).join('');
    }
    // Pedidos
    h += '<div class="row" style="margin-top:8px"><h2>Pedidos de sementes</h2>' + (W() ? '<button class="btn" type="button" data-act="req-new">Solicitar sementes</button>' : '') + '</div>';
    if (env.mode !== 'loading') {
      var reqs = S.requests.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      if (!reqs.length) h += '<div class="empty"><strong>Nenhum pedido ainda</strong><span>Quem precisar de sementes faz o pedido aqui, e quem cuida da compra acompanha a lista.</span></div>';
      else {
        if (reqs.some(function (r) { return r.status === 'pendente'; })) h += '<button class="btn" type="button" data-act="req-copy">Copiar pedidos pendentes para mandar por mensagem</button>';
        h += reqs.map(function (r) {
          var mine = env.mode === 'local' || (env.uid && r.uid === env.uid);
          var ctrl = '';
          if (W() && env.isAdmin) ctrl += '<div class="seg" role="group" aria-label="Situação do pedido">' + Object.keys(REQ_STATUS).map(function (k) { return '<button class="btn small" type="button" data-act="req-status" data-id="' + esc(r.id) + '" data-s="' + k + '" aria-pressed="' + (r.status === k) + '">' + REQ_STATUS[k] + '</button>'; }).join('') + '</div>';
          if (W() && (mine || env.isAdmin)) ctrl += '<div class="actions"><button class="btn small danger" type="button" data-act="del" data-col="requests" data-id="' + esc(r.id) + '">Excluir pedido</button></div>';
          return '<article class="card"><div class="row start"><div class="stack" style="gap:2px"><h3>' + esc(r.name) + ' · ' + esc(r.qty) + ' ' + esc(r.unit || '') + '</h3><span class="meta">Pedido por ' + esc(r.by || 'alguém') + ' em ' + fmtShort(r.date || today()) + (r.urgency === 'urgente' ? ' · urgente' : '') + '</span></div><span class="chip ' + (REQ_CLASS[r.status] || '') + '">' + (REQ_STATUS[r.status] || r.status) + '</span></div>' + (r.note ? '<p>' + esc(r.note) + '</p>' : '') + ctrl + '</article>';
        }).join('');
      }
    }
    $('#p-sementes').innerHTML = h;
  }

  /* ---------- Aba Diário ---------- */
  function renderDiario() {
    var h = readOnlyNotice();
    h += '<div class="row"><h2>Diário da horta</h2>' + (W() ? '<button class="btn primary" type="button" data-act="log-new">Novo registro</button>' : '') + '</div>';
    h += '<div class="seg" role="group" aria-label="Tipo de registro"><button class="btn small" type="button" data-act="lfilter" data-id="todos" aria-pressed="' + (UI.logFilter === 'todos') + '">Todos</button>' + Object.keys(LOG_TYPES).map(function (k) { return '<button class="btn small" type="button" data-act="lfilter" data-id="' + k + '" aria-pressed="' + (UI.logFilter === k) + '">' + LOG_TYPES[k] + '</button>'; }).join('') + '</div>';

    else {
      var list = S.logs.filter(function (l) { return UI.logFilter === 'todos' || l.type === UI.logFilter; }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || (b.createdAt || 0) - (a.createdAt || 0); });
      if (!list.length) h += '<div class="empty"><strong>Nada registrado ainda</strong><span>Anote rega, adubação, pragas, chuva e colheitas. O diário vira a memória da horta.</span></div>';

            (W() ? '<div class="actions"><button class="btn small danger" type="button" data-act="del" data-col="logs" data-id="' + esc(l.id) + '">Excluir</button></div>' : '') + '</article>';

    }
    $('#p-diario').innerHTML = h;
  }

  /* ---------- Formulários (janela deslizante) ---------- */
  function openSheet(title, html, onSubmit) {
    $('#sheetTitle').textContent = title;
    $('#sheetBody').innerHTML = html;
    $('#sheet').hidden = false; document.body.classList.add('noscroll');
    var f = $('#sheetBody form');
    if (f && onSubmit) f.addEventListener('submit', function (e) { e.preventDefault(); onSubmit(new FormData(f), f); });
    var first = $('#sheetBody input:not([type=hidden]), #sheetBody select, #sheetBody textarea, #sheetBody button');
    if (first) setTimeout(function () { first.focus(); }, 30);
  }
  function closeSheet() { $('#sheet').hidden = true; document.body.classList.remove('noscroll'); }
  function myName() { return ls.get('caderno-horta-nome') || env.profileName || ''; }
  function rememberName(fd) { var n = String(fd.get('by') || '').trim(); if (n) ls.set('caderno-horta-nome', n); return n; }
  function nameField() { return '<label for="f-by">Seu nome<input id="f-by" name="by" required maxlength="40" autocomplete="given-name" value="' + esc(myName()) + '"></label>'; }
  function bedList() {
    var set = {}; S.plantings.forEach(function (p) { if (p.bed) set[p.bed] = 1; }); S.logs.forEach(function (l) { if (l.bed) set[l.bed] = 1; });
    return '<datalist id="beds">' + Object.keys(set).sort().map(function (b) { return '<option value="' + esc(b) + '">'; }).join('') + '</datalist>';
  }
  function submitRow(label) { return '<div class="actions"><button class="btn primary" type="submit">' + label + '</button><button class="btn" type="button" data-act="close">Cancelar</button></div>'; }

  function plantForm(cropId) {
    var opts = GROUPS.map(function (g) { return '<optgroup label="' + esc(g) + '">' + CROPS.filter(function (x) { return x.grupo === g; }).map(function (x) { return '<option value="' + x.id + '"' + (x.id === cropId ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('') + '</optgroup>'; }).join('');
    openSheet('Registrar plantio', '<form class="fields"><label for="f-crop">O que foi plantado<select id="f-crop" name="crop" required>' + opts + '</select></label>' +
      '<label for="f-bed">Canteiro<input id="f-bed" name="bed" required list="beds" maxlength="40" placeholder="Ex.: Canteiro 3"></label>' + bedList() +
      '<div class="two"><label for="f-date">Data do plantio<input id="f-date" name="date" type="date" required value="' + today() + '"></label><label for="f-qty">Quantidade (opcional)<input id="f-qty" name="qty" maxlength="40" placeholder="Ex.: 12 mudas"></label></div>' +
      '<p class="hint">No inverno de Curitiba a colheita costuma atrasar de 2 a 4 semanas em relação à previsão.</p><label for="f-note">Observação (opcional)<textarea id="f-note" name="note" maxlength="300"></textarea></label>' + nameField() + submitRow('Salvar plantio') + '</form>',
      async function (fd) {
        var cr = CROP_BY_ID[fd.get('crop')]; var by = rememberName(fd);
        if (!cr) return;
        try {
          var id = await save('plantings', { cropId: cr.id, cropName: cr.nome, bed: String(fd.get('bed')).trim(), plantedOn: fd.get('date'), cycleMin: cr.min, cycleMax: cr.max, qty: String(fd.get('qty') || '').trim(), notes: String(fd.get('note') || '').trim(), status: 'ativo', by: by, uid: env.uid, createdAt: Date.now() });
          await save('logs', { type: 'plantio', bed: String(fd.get('bed')).trim(), text: 'Plantio de ' + cr.nome + (fd.get('qty') ? ' (' + String(fd.get('qty')).trim() + ')' : '') + '.', date: fd.get('date'), by: by, uid: env.uid, ref: id, createdAt: Date.now() });
          closeSheet(); toast('Plantio salvo. Colheita prevista a partir de ' + fmtShort(addDays(fd.get('date'), cr.min)) + '.');
        } catch (e) { fail(e); }
      });
  }
  function harvestForm(id) {
    var p = S.plantings.find(function (x) { return x.id === id; }); if (!p) return;
    openSheet('Registrar colheita de ' + p.cropName, '<form class="fields"><div class="two"><label for="f-date">Data<input id="f-date" name="date" type="date" required value="' + today() + '"></label><label for="f-qty">Quanto colheu (opcional)<input id="f-qty" name="qty" maxlength="40" placeholder="Ex.: 3 kg ou 20 maços"></label></div>' +
      '<label for="f-note">Observação (opcional)<textarea id="f-note" name="note" maxlength="300"></textarea></label>' + nameField() + submitRow('Salvar colheita') + '</form>',
      async function (fd) {
        var by = rememberName(fd), qty = String(fd.get('qty') || '').trim(), note = String(fd.get('note') || '').trim();
        try {
          await save('plantings', Object.assign({}, p, { status: 'colhido', harvestedOn: fd.get('date'), harvestQty: qty }));
          await save('logs', { type: 'colheita', bed: p.bed, text: 'Colheita de ' + p.cropName + (qty ? ': ' + qty : '') + '.' + (note ? ' ' + note : ''), date: fd.get('date'), by: by, uid: env.uid, ref: p.id, createdAt: Date.now() });
          closeSheet(); toast('Colheita registrada.');
        } catch (e) { fail(e); }
      });
  }
  function logForm(type, text) {
    var opts = Object.keys(LOG_TYPES).map(function (k) { return '<option value="' + k + '"' + (k === (type || 'rega') ? ' selected' : '') + '>' + LOG_TYPES[k] + '</option>'; }).join('');
    openSheet('Novo registro', '<form class="fields"><label for="f-type">Tipo<select id="f-type" name="type">' + opts + '</select></label>' +
      '<label for="f-text">O que aconteceu<textarea id="f-text" name="text" required maxlength="400">' + esc(text || '') + '</textarea></label>' +
      '<div class="two"><label for="f-bed">Canteiro (opcional)<input id="f-bed" name="bed" list="beds" maxlength="40"></label><label for="f-date">Data<input id="f-date" name="date" type="date" required value="' + today() + '"></label></div>' + bedList() +
      nameField() + submitRow('Salvar registro') + '</form>',
      async function (fd) {
        var by = rememberName(fd);
        try { await save('logs', { type: fd.get('type'), bed: String(fd.get('bed') || '').trim(), text: String(fd.get('text')).trim(), date: fd.get('date'), by: by, uid: env.uid, createdAt: Date.now() }); closeSheet(); toast('Registro salvo.'); }
        catch (e) { fail(e); }
      });
  }
  function seedDatalist() { return '<datalist id="seednames">' + CROPS.map(function (x) { return '<option value="' + esc(x.nome) + '">'; }).join('') + '</datalist>'; }
  var UNITS = ['pacotes', 'gramas', 'sachês'];
  function unitSelect(sel) { return UNITS.map(function (u) { return '<option' + (u === sel ? ' selected' : '') + '>' + u + '</option>'; }).join(''); }
  function seedForm(id) {
    var s = id ? S.seeds.find(function (x) { return x.id === id; }) : null;
    openSheet(s ? 'Editar semente' : 'Cadastrar semente', '<form class="fields"><label for="f-name">Semente<input id="f-name" name="name" required list="seednames" maxlength="50" value="' + esc(s ? s.name : '') + '"></label>' + seedDatalist() +
      '<div class="two"><label for="f-qty">Quantidade<input id="f-qty" name="qty" type="number" min="0" step="1" required inputmode="numeric" value="' + esc(s ? s.qty : 1) + '"></label><label for="f-unit">Unidade<select id="f-unit" name="unit">' + unitSelect(s && s.unit) + '</select></label></div>' +
      '<label for="f-min">Avisar para repor quando chegar a<input id="f-min" name="min" type="number" min="0" step="1" required inputmode="numeric" value="' + esc(s ? s.min : 1) + '"></label>' +
      '<label for="f-note">Observação (opcional)<input id="f-note" name="note" maxlength="80" value="' + esc(s ? s.note || '' : '') + '" placeholder="Ex.: validade 2027"></label>' + submitRow('Salvar') + '</form>',
      async function (fd) {
        try {
          await save('seeds', Object.assign({}, s || {}, { name: String(fd.get('name')).trim(), qty: Number(fd.get('qty')), unit: fd.get('unit'), min: Number(fd.get('min')), note: String(fd.get('note') || '').trim(), updatedAt: Date.now() }));
          closeSheet(); toast('Semente salva.');
        } catch (e) { fail(e); }
      });
  }
  function reqForm(seedId) {
    var s = seedId ? S.seeds.find(function (x) { return x.id === seedId; }) : null;
    openSheet('Solicitar sementes', '<form class="fields"><label for="f-name">Qual semente<input id="f-name" name="name" required list="seednames" maxlength="50" value="' + esc(s ? s.name : '') + '"></label>' + seedDatalist() +
      '<div class="two"><label for="f-qty">Quantidade<input id="f-qty" name="qty" type="number" min="1" step="1" required inputmode="numeric" value="1"></label><label for="f-unit">Unidade<select id="f-unit" name="unit">' + unitSelect(s && s.unit) + '</select></label></div>' +
      '<label for="f-urg">Urgência<select id="f-urg" name="urgency"><option value="normal">Normal</option><option value="urgente">Urgente</option></select></label>' +
      '<label for="f-note">Observação (opcional)<textarea id="f-note" name="note" maxlength="200" placeholder="Ex.: para o canteiro 4, plantio em março"></textarea></label>' + nameField() + submitRow('Enviar pedido') + '</form>',
      async function (fd) {
        var by = rememberName(fd);
        try { await save('requests', { name: String(fd.get('name')).trim(), qty: Number(fd.get('qty')), unit: fd.get('unit'), urgency: fd.get('urgency'), note: String(fd.get('note') || '').trim(), status: 'pendente', by: by, uid: env.uid, date: today(), createdAt: Date.now() }); closeSheet(); toast('Pedido enviado.'); }
        catch (e) { fail(e); }
      });
  }
  function infoSheet() {
    var body = env.mode === 'shared'
      ? '<p>Os registros ficam guardados no aplicativo e todos que têm acesso veem as mesmas informações, na hora.</p><p>Quem entra só para ver não consegue anotar. Para anotar, a pessoa precisa de acesso de colaborador, dado por quem criou o aplicativo.</p>' + (env.canWrite ? '' : '<div class="notice info">Neste momento você está só vendo.</div>')
      : '<p>Neste momento os registros ficam <b>somente neste aparelho e neste navegador</b>. Se você limpar os dados do navegador, eles se perdem, e ninguém mais os vê.</p>' + (OUTSIDE ? '<p>Esta versão não tem caderno compartilhado. Use o botão Baixar planilhas, na aba Diário, para guardar uma cópia dos registros.</p>' : '<p>Para que todos os moradores registrem no mesmo caderno, quem criou o aplicativo precisa compartilhá-lo com cada pessoa como colaboradora e cada uma precisa entrar com sua conta.</p>');
    openSheet('Onde ficam os registros', '<div class="stack">' + body + '<button class="btn primary" type="button" data-act="close">Entendi</button></div>');
  }
  function copySheet(text) {
    openSheet('Pedidos pendentes', '<div class="fields"><label for="f-copy">Texto para enviar<textarea id="f-copy" readonly rows="8">' + esc(text) + '</textarea></label><div class="actions"><button class="btn primary" type="button" data-act="copy-do">Copiar texto</button><button class="btn" type="button" data-act="close">Fechar</button></div></div>');
    var ta = $('#f-copy'); ta.focus(); ta.select();
  }

  /* ---------- Exportar CSV ---------- */
  var EXPORTS = {
    plantings: { file: 'plantios-horta.csv', cols: [['cropName', 'Cultura'], ['bed', 'Canteiro'], ['plantedOn', 'Plantado em'], ['qty', 'Quantidade'], ['cycleMin', 'Dias mínimos até colher'], ['cycleMax', 'Dias máximos até colher'], ['status', 'Situação'], ['harvestedOn', 'Colhido em'], ['harvestQty', 'Colhido'], ['by', 'Responsável'], ['notes', 'Observação']] },
    logs: { file: 'diario-horta.csv', cols: [['date', 'Data'], ['type', 'Tipo'], ['bed', 'Canteiro'], ['text', 'Registro'], ['by', 'Responsável']] },
    seeds: { file: 'sementes-horta.csv', cols: [['name', 'Semente'], ['qty', 'Quantidade'], ['unit', 'Unidade'], ['min', 'Mínimo'], ['note', 'Observação']] },
    requests: { file: 'pedidos-sementes-horta.csv', cols: [['date', 'Data'], ['name', 'Semente'], ['qty', 'Quantidade'], ['unit', 'Unidade'], ['urgency', 'Urgência'], ['status', 'Situação'], ['by', 'Pedido por'], ['note', 'Observação']] }
  };
  function csvCell(v) { var s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  async function exportCSV(kind) {
    var def = EXPORTS[kind]; if (!def || !(env.dl || OUTSIDE)) return;
    var rows = S[kind].slice();
    var csv = '﻿' + def.cols.map(function (c) { return csvCell(c[1]); }).join(',') + '\n' + rows.map(function (r) { return def.cols.map(function (c) { var v = r[c[0]]; if (c[0] === 'type') v = LOG_TYPES[v] || v; return csvCell(v); }).join(','); }).join('\n');
    if (!env.dl) {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var a = document.createElement('a'); a.href = url; a.download = def.file; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500); toast('Arquivo baixado.'); return;
    }
    try { await env.dl.save({ filename: def.file, data: csv }); toast('Arquivo pronto.'); }
    catch (e) { if (!e || e.code !== 'declined') toast('Não foi possível baixar o arquivo.'); }
  }

  /* ---------- Ações ---------- */
  var armed = null;
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;
    if (act === 'tab') { location.hash = id; if (UI.tab === id) showTab(id); }
    else if (act === 'close') closeSheet();
    else if (act === 'info') infoSheet();
    else if (act === 'group') { UI.group = id; renderEpocas(); }
    else if (act === 'now') { UI.now = !UI.now; renderEpocas(); }
    else if (act === 'view') { UI.view = id; renderEpocas(); }
    else if (act === 'pfilter') { UI.plantFilter = id; renderPlantios(); }
    else if (act === 'lfilter') { UI.logFilter = id; renderDiario(); }
    else if (act === 'crop-goto') { UI.q = CROP_BY_ID[id].nome; UI.group = 'Todas'; UI.now = false; UI.view = 'lista'; location.hash = 'epocas'; if (UI.tab === 'epocas') showTab('epocas'); }
    else if (act === 'plant-new') plantForm(id);
    else if (act === 'harvest') harvestForm(id);
    else if (act === 'log-new') logForm(el.dataset.type, el.dataset.text);
    else if (act === 'seed-new') seedForm();
    else if (act === 'seed-edit') seedForm(id);
    else if (act === 'req-new') reqForm(id);
    else if (act === 'seed-adj') {
      var s = S.seeds.find(function (x) { return x.id === id; });
      if (s) save('seeds', Object.assign({}, s, { qty: Math.max(0, (Number(s.qty) || 0) + Number(el.dataset.d)), updatedAt: Date.now() })).catch(fail);
    }
    else if (act === 'req-status') {
      var r = S.requests.find(function (x) { return x.id === id; });
      if (r && r.status !== el.dataset.s) save('requests', Object.assign({}, r, { status: el.dataset.s })).catch(fail);
    }
    else if (act === 'req-copy') {
      var pend = S.requests.filter(function (x) { return x.status === 'pendente'; });
      copySheet('Pedidos de sementes da horta:\n' + pend.map(function (x) { return '- ' + x.name + ': ' + x.qty + ' ' + (x.unit || '') + (x.urgency === 'urgente' ? ' (urgente)' : '') + ' — ' + (x.by || 'sem nome'); }).join('\n'));
    }
    else if (act === 'copy-do') {
      var ta = $('#f-copy');
      var done = function () { toast('Texto copiado.'); };
      var manual = function () { ta.focus(); ta.select(); toast('Selecione o texto e use Copiar do seu aparelho.'); };
      try { navigator.clipboard.writeText(ta.value).then(done, manual); } catch (err) { manual(); }
    }
    else if (act === 'export') exportCSV(id);
    else if (act === 'del') {
      var key = el.dataset.col + '/' + id;
      if (armed && armed.key === key) {
        clearTimeout(armed.t); armed = null;
        del(el.dataset.col, id).then(function () { toast('Excluído.'); }).catch(fail);
      } else {
        if (armed) { clearTimeout(armed.t); }
        var label = el.textContent;
        el.classList.add('armed'); el.textContent = 'Toque de novo para excluir';
        armed = { key: key, t: setTimeout(function () { armed = null; el.classList.remove('armed'); el.textContent = label; }, 4000) };
      }
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  $('#sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeSheet(); });
  window.addEventListener('hashchange', function () { showTab(location.hash.replace('#', '')); });

  /* ---------- Início ---------- */
  renderHeader();
  showTab(location.hash.replace('#', '') || 'hoje');
  boot();
})();
</script>
